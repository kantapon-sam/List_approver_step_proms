# List page scope. Pending Approval contains only requests visible to the signed-in user.
# A different PROMs list can be configured only if it exposes the same columns/detail workflow.
list.url=https://proms.truecorp.co.th/proms/pendingapprove
search.css=#txtSearch
timeout.seconds=45
login.seconds=300
# Wait for Angular requests, loading overlays, and stable content after search/page changes.
quiet.millis=1800
max.pages=2000
